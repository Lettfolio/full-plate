<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf4e6" />
    <title>Full Plate — Hands-on shift</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23fffdf8' stroke='%232b2622' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23e0533d'/%3E%3C/svg%3E" />
    <style>
      :root { --ink:#2b2622; --soft:#5c534a; --paper:#fffdf8; --cream:#fbf4e6; --tomato:#c4412b; --basil:#3c7a37; --plum:#8a5a9e; --gold:#f2b33d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--cream); color: var(--ink); font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; }
      header { width: 100%; max-width: 1040px; display: flex; align-items: center; gap: 12px; padding: 10px 16px 6px; flex-wrap: wrap; }
      h1 { font-size: 20px; margin: 0 8px 0 0; font-weight: 900; letter-spacing: .2px; }
      .roles { display: flex; gap: 6px; }
      .roles button { font: inherit; font-weight: 800; font-size: 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
      .roles button[aria-pressed="true"] { color: var(--paper); }
      .roles button[data-role="chef"][aria-pressed="true"] { background: var(--tomato); }
      .roles button[data-role="server"][aria-pressed="true"] { background: var(--basil); }
      .roles button[data-role="bar"][aria-pressed="true"] { background: var(--plum); }
      label.tut { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-left: auto; }
      main { width: 100%; max-width: 1040px; padding: 0 8px; }
      canvas { display: block; width: 100%; aspect-ratio: 1024 / 600; max-height: calc(100vh - 140px); background: var(--cream); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); outline: none; }
      canvas:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
      .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 16px 14px; font-size: 14px; color: var(--soft); max-width: 1040px; width: 100%; }
      kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; background: var(--paper); color: var(--ink); font: 800 12px Nunito, system-ui, sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Hands-on shift</h1>
      <div class="roles" role="group" aria-label="Choose a role">
        <button data-role="chef" aria-pressed="true">Chef</button>
        <button data-role="server" aria-pressed="false">Server</button>
        <button data-role="bar" aria-pressed="false">Bar</button>
      </div>
      <label class="tut"><input type="checkbox" id="tutorial" checked /> Show hints</label>
    </header>
    <main><canvas id="view" tabindex="0" aria-label="Hands-on restaurant shift. Use the arrow keys or WASD to move and E to interact."></canvas></main>
    <div class="keys" aria-label="Controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows — walk</span>
      <span><kbd>E</kbd> / <kbd>Space</kbd> — use (tap to chop &amp; clear, hold to cook &amp; pour)</span>
      <span><kbd>Q</kbd> / <kbd>Esc</kbd> — cancel · press twice to bin what you carry</span>
      <span>Gamepad: left stick + <kbd>A</kbd>, <kbd>B</kbd> to cancel</span>
      <span><kbd>R</kbd> — restart shift</span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
