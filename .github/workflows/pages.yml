name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs (red-team S7).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (red-team S8). The comment is the tag that SHA was
# resolved from (`git ls-remote --tags`); Dependabot (.github/dependabot.yml) proposes bumps.
jobs:
  build:
    runs-on: ubuntu-latest
    # The build job installs ~270 dev dependencies, so it gets read-only access and no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Round 13 (E, S12): the Pages build carries a meta Content-Security-Policy (packages/game/src/csp.config.ts).
      - run: pnpm --filter @full-plate/game build
        env:
          FP_TARGET: pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job, which runs no project code, can write Pages and mint the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # configure-pages reads (and if needed enables) the Pages site, which needs `pages`, so it
      # lives here rather than in the read-only build job. Its outputs were never used by the build.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
