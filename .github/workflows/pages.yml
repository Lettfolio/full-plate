name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs (red-team S7).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (red-team S8). The comment is the tag that SHA was
# resolved from (`git ls-remote --tags`); Dependabot (.github/dependabot.yml) proposes bumps.
jobs:
  build:
    runs-on: ubuntu-latest
    # The build job installs ~270 dev dependencies, so it gets read-only access and no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @full-plate/game build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job, which runs no project code, can write Pages and mint the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # configure-pages reads (and if needed enables) the Pages site, which needs `pages`, so it
      # lives here rather than in the read-only build job. Its outputs were never used by the build.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
